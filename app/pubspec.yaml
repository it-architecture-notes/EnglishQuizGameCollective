name: english_quiz_game
description: Portrait-only English quiz mobile app (Android + iOS).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/backgrounds/phone_tall/
    - assets/images/backgrounds/phone_wide/
    - assets/images/backgrounds/tablet_43/
    - assets/images/backgrounds/tablet_1610/
    - assets/images/buttons/
    - assets/images/characters/
    - assets/images/avatars/
    - assets/images/level-icons/
    - assets/images/achievements/
    - assets/images/friends/
    - assets/data/state/
    - assets/data/config/
    - assets/data/settings/
    - assets/data/flow/
    - assets/quiz-data/image-quiz/quiz-images/
    - assets/quiz-data/image-quiz/quiz-images/airport-1/
    - assets/quiz-data/vocabulary-quiz/
    - assets/quiz-data/grammar-quiz/
