name: english_quiz_game
description: Portrait-only English quiz mobile app (Android + iOS).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  flutter_riverpod: ^2.6.1
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

